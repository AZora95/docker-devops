name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            percorso-be/package-lock.json
            percorso-fe/package-lock.json

      - name: Install BE deps
        if: ${{ hashFiles('percorso-be/package-lock.json') != '' }}
        working-directory: percorso-be
        run: npm ci

      - name: Run BE tests
        if: ${{ hashFiles('percorso-be/package-lock.json') != '' }}
        working-directory: percorso-be
        run: npm test --if-present

      - name: Install FE deps
        if: ${{ hashFiles('percorso-fe/package-lock.json') != '' }}
        working-directory: percorso-fe
        run: npm ci

      - name: FE build (smoke)
        if: ${{ hashFiles('percorso-fe/package-lock.json') != '' }}
        working-directory: percorso-fe
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: percorso-be/Dockerfile
        continue-on-error: true
